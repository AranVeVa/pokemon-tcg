services:
  # Backend API en Render
  - type: web
    name: pokemon-tcg-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MODO_DEMO
        value: "true"
      - key: DATABASE_URL
        sync: false # Pega aquí tu Connection String de Neon PostgreSQL
      - key: SMTP_USER
        sync: false # Tu correo Gmail para envíos reales (ej: usuario@gmail.com)
      - key: SMTP_PASS
        sync: false # Contraseña de aplicación de Google de 16 letras
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false # URL real de tu frontend en Vercel (ej. https://tu-app.vercel.app), requerida por Stripe Checkout
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
